<!DOCTYPE html>
<html lang="zh-Hant" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>時數確認單 | NewCore</title>
<style>
:root{
  --green:#274e13; --green-l:#3a6b22;
  --ink:#1f2328; --muted:#6b7280; --line:#e3e6ea;
  --bg:#f4f6f4; --card:#fff;
  --red:#c5221f; --amber:#b45309; --amber-bg:#fef6e7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC",-apple-system,"Segoe UI",sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 0 60px}

header{background:var(--green);color:#fff;padding:26px 20px}
header .ym{font-size:13px;opacity:.85;letter-spacing:.05em}
header h1{margin:2px 0 0;font-size:21px;font-weight:700}
header .who{margin-top:6px;font-size:15px;opacity:.92}

.card{background:var(--card);margin:14px;border:1px solid var(--line);
  border-radius:12px;overflow:hidden}
.card h2{margin:0;padding:13px 16px;font-size:14px;font-weight:700;
  border-bottom:1px solid var(--line);background:#fafbfa;color:#374151}
.pad{padding:16px}

.total{text-align:center;padding:22px 16px}
.total .n{font-size:40px;font-weight:800;color:var(--green);line-height:1.1}
.total .u{font-size:15px;font-weight:600;color:var(--muted);margin-left:4px}
.total .sub{margin-top:4px;font-size:14px;color:var(--muted)}

table.brk{width:100%;border-collapse:collapse}
table.brk td{padding:11px 16px;border-top:1px solid var(--line);font-size:15px}
table.brk tr:first-child td{border-top:none}
table.brk td.role{font-weight:600;width:34%}
table.brk td.hrs{text-align:right;width:33%;font-variant-numeric:tabular-nums}
table.brk td.cnt{text-align:right;width:33%;font-variant-numeric:tabular-nums;color:var(--muted)}
.sub-row td.role,.sub-row td.hrs{color:var(--red)}

.cls{padding:13px 16px;border-top:1px solid var(--line)}
.cls:first-child{border-top:none}
.cls .nm{font-weight:700;font-size:15px;margin-bottom:3px}
.cls .ln{font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between}
.cls .ln b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

label.chk{display:flex;gap:11px;align-items:flex-start;cursor:pointer;
  padding:14px;border:2px solid var(--line);border-radius:10px;margin-bottom:14px}
label.chk.on{border-color:var(--green);background:#f2f7ef}
label.chk input{width:21px;height:21px;margin:1px 0 0;flex:none;accent-color:var(--green)}
label.chk span{font-size:15px;font-weight:600}

.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
.fld input,.fld textarea{width:100%;padding:11px 12px;border:1px solid #cfd4da;
  border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--green);
  box-shadow:0 0 0 3px rgba(39,78,19,.12)}
.fld textarea{min-height:84px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}

button.go{width:100%;padding:15px;border:none;border-radius:10px;background:var(--green);
  color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
button.go:active{background:var(--green-l)}
button.go:disabled{background:#9aa3ab;cursor:not-allowed}
button.go.warn{background:var(--amber)}

.note{margin:14px;padding:13px 15px;border-radius:10px;font-size:14px}
.note.warn{background:var(--amber-bg);border:1px solid #f0d9a8;color:var(--amber)}
.note.err{background:#fdeceb;border:1px solid #f5c6c4;color:var(--red)}
.note.ok{background:#eef6e9;border:1px solid #cbe3bd;color:var(--green)}

.done{margin:14px;padding:26px 20px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;text-align:center}
.done .ic{font-size:42px;line-height:1}
.done h2{margin:10px 0 4px;font-size:19px;color:var(--green)}
.done p{margin:3px 0;font-size:14px;color:var(--muted)}
.done .sig{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
  font-size:14px;color:var(--ink)}

.foot{text-align:center;font-size:12px;color:var(--muted);padding:18px 20px}
.center{text-align:center;padding:50px 20px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="center">載入中… / Loading…</div>
  <div id="fatal" class="center" hidden></div>
  <div id="app" hidden></div>
</div>
<script>
/* 語法錯誤會讓整個 <script> 區塊停擺，所以這段要自己獨立一塊，
   否則它會跟出錯的程式碼一起陣亡。confirm.html 那次就是這種。
   三個頁面（confirm / leave / handover）可以貼完全一樣的內容：
   fatal → boot → loading → body，依序找得到哪個用哪個。*/
window.onerror = function (msg, src, line, col) {
  try {
    var box = document.getElementById('fatal')
           || document.getElementById('boot')
           || document.getElementById('loading')
           || document.body;

    // 還在轉圈圈的那一塊藏起來（除非它就是要拿來顯示的那塊）
    var load = document.getElementById('loading') || document.getElementById('boot');
    if (load && load !== box) load.hidden = true;

    box.hidden = false;
    box.innerHTML =
      '<div style="padding:18px;text-align:left;font:13px/1.7 sans-serif;color:#b00020">'
      + '<b>頁面載入失敗 / Page failed to load</b><br>'
      + '請把這整段截圖傳給管理者 / Please screenshot this:<br><br>'
      + '<code style="display:block;background:#fff3f3;padding:10px;border-radius:6px;'
      +   'word-break:break-all;white-space:pre-wrap;color:#900">'
      + String(msg) + '\n@ line ' + line + (col ? ':' + col : '')
      + '</code></div>';
  } catch (e) { /* 連這個都失敗就真的沒辦法了 */ }
  return false;        // false = 仍然照常丟到 Console，方便你自己看
};
</script>
<script>

/* ══════════════════════════════════════════════════════
   ⬇⬇⬇  唯一要改的一行：整組引號內容換成排課系統的 GAS 網址  ⬇⬇⬇
   （部署 → 管理部署作業 → 複製 .../exec 那條，只會有一個 https://）
   ══════════════════════════════════════════════════════ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxaxdc_F9-y_IgW2ah5kyqvGJ8lSKLBJIOesILXYaYjDABTSh1YN7SKSZ2n6Hj7WpLleA/exec';

/* ---------- 語言字典 ---------- */
const MON_EN = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

const I18N = {
  zh: {
    period:(y,m)=>`${y} 年 ${m} 月`,
    title:'教學時數確認單',
    who:n=>`${n} 老師`,
    unitHr:'小時', unitTimes:n=>`共 ${n} 次`, times:'次',
    lead:'主教', assist:'助教', sub:'休代',
    classDetail:'班級明細', noClass:'本月無班級明細',
    doneTitle:'已完成確認', sigLabel:'簽名', noteLabel:'備註',
    doneFoot:'如需更正，請聯繫 Jeffrey。<br>NewCore 教務系統',
    voided:'這份確認單已因排課更正而作廢，請改用最新一封信裡的連結。',
    disputeTitle:'你已回報疑義，Jeffrey 處理中。',
    disputeL1:'數字更正後會另外寄一封<b>新的連結</b>給你，屆時請用那封確認',
    disputeL2:'若你發現是自己看錯、這些數字其實沒問題，可直接在下方勾選確認',
    disputeL3:'還有要補充的，也可以再次送出',
    formTitle:'核對與簽名',
    agreeText:'我已核對上方時數，確認無誤',
    sigField:'你的姓名（等同簽名）', sigPh:'請輸入姓名',
    noteField:'備註／有疑義的地方',
    notePh:'數字有出入請寫在這裡，例如：8/22 那堂我請假，不應計入',
    noteHint:'若<b>不勾選</b>上方確認、只填備註送出，系統會記為「有疑義」並通知 Jeffrey。',
    btn:'送出', btnAgree:'確認並送出', btnForce:'仍要送出', btnSending:'送出中…', btnSent:'已送出',
    errNoSig:'請輸入你的姓名。',
    errNoNote:'若未勾選確認，請在備註說明哪裡有問題。',
    warnName:n=>`你輸入的姓名與系統紀錄（${n}）不同。確定無誤請再按一次。`,
    okDispute:'已送出，狀態記為「有疑義」，Jeffrey 會盡快處理。',
    errVoided:'這份確認單已作廢，請使用最新的連結。',
    errSend:e=>`送出失敗：${e}`,
    foot:'此頁由 NewCore 教務系統自動產生<br>連結專屬於你本人，請勿轉發',
    closed:'本月時數已定案關帳，無法再確認。如有問題請聯繫 Jeffrey。',
  },
  en: {
    period:(y,m)=>`${MON_EN[m-1]} ${y}`,
    title:'Teaching Hours Confirmation',
    who:n=>n,
    unitHr:'hours', unitTimes:n=>`${n} sessions`, times:'sessions',
    lead:'Lead', assist:'Assist', sub:'Cover',
    classDetail:'Class Breakdown', noClass:'No classes recorded this month',
    doneTitle:'Confirmed', sigLabel:'Signed', noteLabel:'Note',
    doneFoot:'Need a correction? Please contact Jeffrey.<br>NewCore',
    voided:'This confirmation form has been voided because the schedule was corrected. Please use the link in the latest email.',
    disputeTitle:'You have reported an issue. Jeffrey is looking into it.',
    disputeL1:'Once the figures are corrected you will receive a <b>new link</b> — please confirm using that one',
    disputeL2:'If you realise the figures were actually correct, you can simply tick the box below and confirm',
    disputeL3:'You can also submit again to add more detail',
    formTitle:'Review & Sign',
    agreeText:'I have reviewed the hours above and confirm they are correct',
    sigField:'Your name (this acts as your signature)', sigPh:'Enter your name',
    noteField:'Notes / what looks wrong',
    notePh:'e.g. I was on leave on Aug 22 — that session should not be counted',
    noteHint:'If you submit <b>without ticking</b> the box, this will be recorded as an issue and Jeffrey will be notified.',
    btn:'Submit', btnAgree:'Confirm & Submit', btnForce:'Submit anyway',
    btnSending:'Submitting…', btnSent:'Submitted',
    errNoSig:'Please enter your name.',
    errNoNote:'If you are not ticking the confirmation box, please describe the issue in the notes.',
    warnName:n=>`The name you entered does not match our records (${n}). Tap again if it is correct.`,
    okDispute:'Submitted. This has been recorded as an issue — Jeffrey will follow up.',
    errVoided:'This form has been voided. Please use the latest link.',
    errSend:e=>`Could not submit: ${e}`,
    foot:'Automatically generated by NewCore<br>This link is unique to you — please do not forward it',
    closed:'This month has been finalised and can no longer be confirmed. Please contact Jeffrey.',
  }
};
let T = I18N.zh;

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num = v => (Math.round((Number(v)||0)*100)/100);
const NOTE_MAX = 300;

/* 送出與讀取都走 JSONP：<script> 標籤完全不經過 CORS。
   手機內嵌瀏覽器（LINE / FB / Gmail App）用 fetch POST 會讀不到 GAS 的 302 回應 */
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb = 'ncb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const timer = setTimeout(()=>{ cleanup(); reject(new Error('連線逾時 / Timed out')); }, 45000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); resolve(d); };
    s.onerror = () => { cleanup(); reject(new Error('無法連線 / Cannot reach the server')); };
    s.src = GAS_URL + '?' + new URLSearchParams({...params, callback: cb});
    document.head.appendChild(s);
  });
}

/* ---------- 狀態 ---------- */
const token = new URLSearchParams(location.search).get('t') || '';
let DATA = null;
let nameWarned = false;
let sending = false;

/* ---------- 啟動 ---------- */
(async function init(){
  if (!token) return fatal('這個連結缺少確認碼，請使用信件中的完整連結。<br>This link is missing its code — please use the full link from the email.');
  if (GAS_URL.indexOf('PASTE_YOUR') === 0) return fatal('系統尚未設定完成（GAS_URL 未填）。');
  try {
    const r = await jsonp({ action:'getConfirmData', t: token });
    if (!r || !r.ok) {
      const m = {
        invalid_token:'這個確認連結無效，或已被重新發送。請使用最新一封信裡的連結。<br>This link is no longer valid — please use the one in the most recent email.',
        missing_token:'連結不完整。 / Incomplete link.'
      }[r && r.error] || ('讀取失敗 / Failed to load：' + ((r&&r.error)||'unknown'));
      return fatal(m);
    }
    DATA = r.data;
    T = I18N[DATA.lang === 'en' ? 'en' : 'zh'];
    document.documentElement.lang = (DATA.lang === 'en') ? 'en' : 'zh-Hant';
    render();
  } catch (e) { fatal(esc(e.message)); }
})();

function fatal(msgHtml){
  $('#loading').hidden = true;
  const el = $('#fatal');
  el.hidden = false;
  el.innerHTML = `<div class="note err" style="margin:20px 0;text-align:left">${msgHtml}</div>`;
}

/* ---------- 畫面 ---------- */
function render(){
  const d = DATA;
  $('#loading').hidden = true;
  const app = $('#app');
  app.hidden = false;

  const rows = [
    { label:T.lead,   hrs:num(d.leadHrs),   cnt:d.leadCnt||0,   cls:'' },
    { label:T.assist, hrs:num(d.assistHrs), cnt:d.assistCnt||0, cls:'' },
    { label:T.sub,    hrs:num(d.subHrs),    cnt:d.subCnt||0,    cls:'sub-row' }
  ].filter(r => r.hrs > 0 || r.cnt > 0);

  const totalCnt = (d.leadCnt||0) + (d.assistCnt||0) + (d.subCnt||0);

  const clsHtml = Object.keys(d.classes || {}).sort().map(name => {
    const c = d.classes[name];
    const lines = [
      [T.lead,   num(c.lead),   c.leadCnt   || 0],
      [T.assist, num(c.assist), c.assistCnt || 0],
      [T.sub,    num(c.sub),    c.subCnt    || 0]
    ].filter(x => x[1] > 0 || x[2] > 0)
     .map(x => `<div class="ln"><span>${x[0]}</span><b>${x[1]} ${T.unitHr} · ${x[2]} ${T.times}</b></div>`)
     .join('');
    return `<div class="cls"><div class="nm">${esc(name)}</div>${lines}</div>`;
  }).join('') || `<div class="pad" style="color:#6b7280">${T.noClass}</div>`;

  const header = `
    <header>
      <div class="ym">${T.period(d.year, d.month)}</div>
      <h1>${T.title}</h1>
      <div class="who">${esc(T.who(d.teacher))}</div>
    </header>`;

  const summary = `
    <div class="card">
      <div class="total">
        <div><span class="n">${num(d.totalHrs)}</span><span class="u">${T.unitHr}</span></div>
        <div class="sub">${T.unitTimes(totalCnt)}</div>
      </div>
      <table class="brk">
        ${rows.map(r=>`<tr class="${r.cls}">
          <td class="role">${r.label}</td>
          <td class="hrs">${r.hrs} ${T.unitHr}</td>
          <td class="cnt">${r.cnt} ${T.times}</td></tr>`).join('')}
      </table>
    </div>
    <div class="card"><h2>${T.classDetail}</h2>${clsHtml}</div>`;

  /* 已確認 → 唯讀 */
  if (d.status === '已確認') {
    app.innerHTML = header + summary + `
      <div class="done">
        <div class="ic">✅</div>
        <h2>${T.doneTitle}</h2>
        <p>${esc(d.confirmedAt)}</p>
        <div class="sig">${T.sigLabel}：<b>${esc(d.signature)}</b></div>
        ${d.note ? `<div class="sig">${T.noteLabel}：${esc(d.note)}</div>` : ''}
      </div>
      <div class="foot">${T.doneFoot}</div>`;
    return;
  }

  if (d.status === '已作廢') {
    app.innerHTML = header
      + `<div class="note warn">${T.voided}</div>`
      + `<div class="foot">${T.foot}</div>`;
    return;
  }

  /* 待確認 / 有疑義 → 可填寫 */
  const prevNote = d.status === '有疑義' ? (d.note || '') : '';
  app.innerHTML = header
    + (d.status === '有疑義'
        ? `<div class="note warn"><b>${T.disputeTitle}</b><br>
             ・${T.disputeL1}<br>・${T.disputeL2}<br>・${T.disputeL3}</div>` : '')
    + summary + `
    <div class="card">
      <h2>${T.formTitle}</h2>
      <div class="pad">
        <label class="chk" id="chkBox">
          <input type="checkbox" id="agree">
          <span>${T.agreeText}</span>
        </label>

        <div class="fld">
          <label for="sig">${T.sigField}</label>
          <input id="sig" type="text" autocomplete="name" placeholder="${T.sigPh}">
        </div>

        <div class="fld">
          <label for="note">${T.noteField}</label>
          <textarea id="note" maxlength="${NOTE_MAX}" placeholder="${T.notePh}">${esc(prevNote)}</textarea>
          <div class="hint">${T.noteHint}<span id="cnt" style="float:right"></span></div>
        </div>

        <div id="msg"></div>
        <button class="go" id="btn">${T.btn}</button>
      </div>
    </div>
    <div class="foot">${T.foot}</div>`;

  const agree = $('#agree'), btn = $('#btn');
  agree.addEventListener('change', ()=>{
    $('#chkBox').classList.toggle('on', agree.checked);
    btn.textContent = agree.checked ? T.btnAgree : T.btn;
    nameWarned = false; btn.classList.remove('warn');
  });
  $('#sig').addEventListener('input', ()=>{ nameWarned = false; btn.classList.remove('warn'); });

  const noteEl = $('#note'), cntEl = $('#cnt');
  const tick = ()=>{ cntEl.textContent = `${noteEl.value.length} / ${NOTE_MAX}`; };
  noteEl.addEventListener('input', tick); tick();

  btn.addEventListener('click', submit);
}

/* ---------- 送出 ---------- */
function msg(cls, html){ $('#msg').innerHTML = `<div class="note ${cls}" style="margin:0 0 14px">${html}</div>`; }

async function submit(){
  if (sending) return;
  const agreed = $('#agree').checked;
  const sig    = $('#sig').value.trim();
  const note   = $('#note').value.trim();
  const btn    = $('#btn');
  const restore = () => { btn.disabled = false; btn.textContent = agreed ? T.btnAgree : T.btn; };

  if (agreed && !sig)  return msg('err', T.errNoSig);
  if (!agreed && !note) return msg('err', T.errNoNote);

  // 姓名比對：不符只提示，第二次點擊仍可送出
  if (sig && !nameWarned) {
    const a = DATA.teacher.replace(/\s/g,'').toLowerCase();
    const b = sig.replace(/\s/g,'').toLowerCase();
    if (a.indexOf(b) < 0 && b.indexOf(a) < 0) {
      nameWarned = true;
      btn.classList.add('warn');
      btn.textContent = T.btnForce;
      return msg('warn', esc(T.warnName(DATA.teacher)));
    }
  }

  sending = true;
  btn.disabled = true;
  btn.textContent = T.btnSending;
  try {
    const r = await jsonp({
      action:'submitConfirm', token,
      agreed: agreed ? '1' : '0',
      signature: sig, note
    });
    if (r && r.ok) {
      DATA.status      = r.status;
      DATA.signature   = sig;
      DATA.note        = note;
      DATA.confirmedAt = new Date().toLocaleString(
        DATA.lang === 'en' ? 'en-GB' : 'zh-TW', { hour12:false });
      if (r.status === '已確認') { render(); window.scrollTo(0,0); }
      else {
        msg('ok', T.okDispute);
        btn.textContent = T.btnSent; btn.disabled = true;
      }
      return;
    }
    if (r && r.error === 'already') { DATA = r.data; render(); window.scrollTo(0,0); return; }
    if (r && r.error === 'voided')  msg('warn', T.errVoided);
    else if (r && r.error === 'closed') msg('warn', T.closed);
    else msg('err', esc(T.errSend((r && r.error) || 'unknown')));
    restore();
  } catch (e) {
    msg('err', esc(T.errSend(e.message)));
    restore();
  } finally {
    sending = false;
  }
}
</script>
</body>
</html>
