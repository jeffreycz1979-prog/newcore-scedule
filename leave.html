<!DOCTYPE html>
<html lang="zh-Hant" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="google" content="notranslate">
<title>請假申請 Leave Request</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#22303c; --muted:#6b7c8a;
    --line:#dde4ea; --brand:#00695c; --brand-d:#004d40;
    --warn:#fff8e1; --warn-b:#fbc02d; --err:#c62828; --ok:#2e7d32;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:0 14px 60px;background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,"Noto Sans TC","Segoe UI",Arial,sans-serif}
  .wrap{max-width:640px;margin:0 auto}
  header{padding:22px 0 14px}
  h1{margin:0;font-size:20px;letter-spacing:.5px}
  .who{margin-top:6px;color:var(--muted);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 12px;font-size:15px;color:var(--brand-d);
           border-left:3px solid var(--brand);padding-left:8px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  input[type=date],input[type=text],select,textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:7px;
    font:inherit;font-size:16px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:88px}
  .counter{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
  .counter.over{color:var(--err);font-weight:700}

  /* ---- 分頁 ---- */
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;padding:11px 8px;border-radius:8px;font-size:15px;
               background:#e3eaef;color:var(--brand-d);font-weight:600}
  .tabs button.on{background:var(--brand);color:#fff}

  .lesson{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;
          background:#fbfdfe}
  .lesson.on{border-color:var(--brand);background:#e8f5f3}
  .lesson.dim{opacity:.55}
  .lrow{display:flex;align-items:flex-start;gap:10px}
  .lrow input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto}
  .lmeta{flex:1;min-width:0}
  .lcls{font-weight:700}
  .ltag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;
        background:#e0e0e0;color:#444;margin-left:6px}
  .ltag.lead{background:#00695c;color:#fff}
  .ltag.asst{background:#5c6bc0;color:#fff}
  .lsub{margin-top:9px;display:none}
  .lesson.on .lsub{display:block}
  .note{font-size:12px;color:var(--muted);margin-top:4px}
  .applied{font-size:12px;color:var(--err);margin-top:4px}

  /* ---- 我的申請 ---- */
  .app-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
            border-left:3px solid var(--brand);padding-left:9px;margin-bottom:10px}
  .app-date{font-size:16px;font-weight:700}
  .app-id{font-size:12px;color:var(--muted)}
  .st{display:inline-block;font-size:12px;padding:2px 9px;border-radius:11px;
      background:#e0e0e0;color:#444;white-space:nowrap}
  .st.wait{background:#fff8e1;color:#8d6e00}
  .st.ok{background:#e8f5e9;color:#1b5e20}
  .st.no{background:#ffebee;color:#8e1414}
  .st.gone{background:#eceff1;color:#546e7a}
  .item{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
  .item:first-of-type{border-top:0;padding-top:0;margin-top:0}
  .hbtns{display:flex;gap:8px;margin-top:8px}
  .hbtns button{font-size:14px;padding:10px}
  .btn-ghost{background:#e3eaef;color:var(--brand-d)}
  .btn-danger{background:#ffebee;color:#8e1414}
  .saved{font-size:12px;color:var(--ok);margin-top:6px;display:none}
  .saved.show{display:block}

  button{width:100%;padding:14px;border:0;border-radius:8px;background:var(--brand);
         color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{background:#b0bec5;cursor:default}
  .msg{padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:14px;display:none}
  .msg.show{display:block}
  .msg.warn{background:var(--warn);border-left:3px solid var(--warn-b)}
  .msg.err{background:#ffebee;border-left:3px solid var(--err);color:#8e1414}
  .msg.ok{background:#e8f5e9;border-left:3px solid var(--ok);color:#1b5e20}
  .center{text-align:center;padding:50px 20px;color:var(--muted)}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid #cfd8dc;
        border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div id="boot" class="center"><div class="spin"></div><p id="bootMsg">載入中…</p></div>

  <div id="app" class="hide">
    <header>
      <h1 id="tTitle">請假申請</h1>
      <div class="who" id="tWho"></div>
    </header>

    <div class="tabs">
      <button id="tabNew" class="on"></button>
      <button id="tabMine"></button>
    </div>

    <div id="msg" class="msg"></div>

    <!-- ============ 分頁一：提出申請 ============ -->
    <div id="viewNew">
      <div class="card">
        <h2 id="tStep1">1. 請假日期</h2>
        <input type="date" id="date">
        <div class="note" id="tDateHint">選好日期後會自動列出你當天的課。</div>
      </div>

      <div class="card hide" id="lessonCard">
        <h2 id="tStep2">2. 要請哪幾堂</h2>
        <div id="lessons"></div>
      </div>

      <div class="card hide" id="reasonCard">
        <h2 id="tStep3">3. 請假事由</h2>
        <textarea id="reason" maxlength="200"></textarea>
        <div class="counter" id="cnt">0 / 200</div>
        <div class="note" id="tHandoverNote">
          交接事項不用現在填。核准後到「我的申請」逐堂補就好。
        </div>
      </div>

      <div class="card hide" id="sendCard">
        <button id="send" disabled></button>
        <div class="note" id="tSendNote" style="margin-top:10px"></div>
      </div>
    </div>

    <!-- ============ 分頁二：我的申請 ============ -->
    <div id="viewMine" class="hide">
      <div id="mineBody"></div>
    </div>
  </div>

  <div id="done" class="hide">
    <header><h1 id="tDone">已送出</h1></header>
    <div class="msg ok show" id="doneMsg"></div>
    <div class="card"><div id="doneList"></div></div>
    <button id="backBtn" class="btn-ghost" style="margin-top:4px"></button>
  </div>

</div>

function T(k){ return I18N[LANG][k]; }

/* ---------- JSONP ---------- */
var jsonpSeq = 0;
function jsonp(params, cb, errCb){
  var name = 'lcb' + (++jsonpSeq) + '_' + Date.now();
  var done = false;
  var s = document.createElement('script');

  var timer = setTimeout(function(){
    if (done) return;
    done = true; cleanup();
    errCb && errCb('timeout');
  }, TIMEOUT);

  function cleanup(){
    clearTimeout(timer);
    try { delete window[name]; } catch(e) { window[name] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
  }

  window[name] = function(data){
    if (done) return;
    done = true; cleanup();
    cb(data);
  };

  var q = [];
  for (var k in params) {
    if (params[k] === undefined || params[k] === null) continue;
    q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  }
  q.push('callback=' + name);

  s.src = GAS_URL + '?' + q.join('&');
  s.onerror = function(){
    if (done) return;
    done = true; cleanup();
    errCb && errCb('neterror');
  };
  document.body.appendChild(s);
}

/* ---------- 小工具 ---------- */
function $(id){ return document.getElementById(id); }
function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function show(el){ el.classList.remove('hide'); }
function hide(el){ el.classList.add('hide'); }
function say(kind, text){
  var m = $('msg');
  m.className = 'msg show ' + kind;
  m.innerHTML = text;
  window.scrollTo(0, 0);
}
function clearSay(){ $('msg').className = 'msg'; }

var WD_ZH = ['日','一','二','三','四','五','六'];
var WD_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dateLabel(ymd){
  var p = String(ymd).split('-');
  if (p.length !== 3) return ymd;
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  if (isNaN(d.getTime())) return ymd;
  return (LANG === 'en')
    ? WD_EN[d.getDay()] + ' ' + (+p[1]) + '/' + (+p[2])
    : (+p[1]) + '/' + (+p[2]) + '（' + WD_ZH[d.getDay()] + '）';
}
function stClass(s){
  if (s === '已核准') return 'ok';
  if (s === '已駁回') return 'no';
  if (s === '已撤銷') return 'gone';
  return 'wait';
}

/* ---------- 啟動 ---------- */
(function init(){
  var m = location.search.match(/[?&]t=([^&]+)/);
  TOKEN = m ? decodeURIComponent(m[1]) : '';
  if (!TOKEN) { $('bootMsg').textContent = I18N.zh.errToken; return; }

  jsonp({ action:'getLeaveInit', token:TOKEN }, function(d){
    if (!d || !d.ok) { $('bootMsg').textContent = I18N.zh.errToken; return; }
    LANG = d.teacher.lang || 'zh';
    TEACHERS = d.teachers || [];
    document.documentElement.lang = (LANG === 'en') ? 'en' : 'zh-Hant';

    $('tTitle').textContent        = T('title');
    $('tStep1').textContent        = T('step1');
    $('tStep2').textContent        = T('step2');
    $('tStep3').textContent        = T('step3');
    $('tDateHint').textContent     = T('dateHint');
    $('tHandoverNote').textContent = T('handoverNote');
    $('tSendNote').textContent     = T('sendNote');
    $('send').textContent          = T('send');
    $('tabNew').textContent        = T('tabNew');
    $('tabMine').textContent       = T('tabMine');
    $('backBtn').textContent       = T('back');
    $('tWho').textContent          = d.teacher.name + T('who').replace('{r}', d.teacher.role);

    hide($('boot')); show($('app'));
  }, function(){
    $('bootMsg').textContent = I18N.zh.errNet;
  });
})();

/* ---------- 分頁切換 ---------- */
$('tabNew').addEventListener('click', function(){ switchTo('new'); });
$('tabMine').addEventListener('click', function(){ switchTo('mine'); });
$('backBtn').addEventListener('click', function(){
  hide($('done')); show($('app')); switchTo('new');
  $('date').value = ''; hide($('lessonCard')); hide($('reasonCard')); hide($('sendCard'));
  $('reason').value = ''; $('cnt').textContent = '0 / 200';
});

function switchTo(v){
  VIEW = v;
  clearSay();
  $('tabNew').classList.toggle('on', v === 'new');
  $('tabMine').classList.toggle('on', v === 'mine');
  $('viewNew').classList.toggle('hide', v !== 'new');
  $('viewMine').classList.toggle('hide', v !== 'mine');
  window.scrollTo(0, 0);
  if (v === 'mine') loadMine();
}

/* ---------- 選日期 → 查課 ---------- */
$('date').addEventListener('change', function(){
  var d = this.value;
  clearSay();
  hide($('reasonCard')); hide($('sendCard'));
  if (!d) { hide($('lessonCard')); return; }

  show($('lessonCard'));
  $('lessons').innerHTML = '<div class="center"><div class="spin"></div><p>'
                         + esc(T('loadingLessons')) + '</p></div>';

  jsonp({ action:'getLeaveLessons', token:TOKEN, date:d }, function(r){
    if (!r || !r.ok) { $('lessons').innerHTML = '<p class="applied">' + esc(T('errToken')) + '</p>'; return; }
    LESSONS = r.lessons || [];
    renderLessons();
  }, function(){
    $('lessons').innerHTML = '<p class="applied">' + esc(T('errNet')) + '</p>';
  });
});

function renderLessons(){
  if (!LESSONS.length) {
    $('lessons').innerHTML = '<p class="note">' + esc(T('noLesson')) + '</p>';
    hide($('reasonCard')); hide($('sendCard'));
    return;
  }

  var opts = '<option value="">' + esc(T('choose')) + '</option>';
  for (var i = 0; i < TEACHERS.length; i++) {
    var t = TEACHERS[i];
    opts += '<option value="' + esc(t.name) + '">' + esc(t.name)
          + (t.role ? '（' + esc(t.role) + '）' : '') + '</option>';
  }
  opts += '<option value="__other__">' + esc(T('other')) + '</option>';
  opts += '<option value="__none__">' + esc(T('notyet')) + '</option>';

  var h = '';
  LESSONS.forEach(function(L, i){
    var locked = !!L.applied;
    var tag = (L.role === '主教')
      ? '<span class="ltag lead">' + esc(T('lead')) + '</span>'
      : '<span class="ltag asst">' + esc(T('asst')) + '</span>';

    h += '<div class="lesson' + (locked ? ' dim' : '') + '" id="L' + i + '">'
       +   '<div class="lrow">'
       +     '<input type="checkbox" id="c' + i + '" data-i="' + i + '"'
       +        (locked ? ' disabled' : '') + '>'
       +     '<div class="lmeta">'
       +       '<div><span class="lcls">' + esc(L.cls) + '</span>' + tag + '</div>'
       +       '<div class="note">' + esc(L.pc) + ' ｜ ' + esc(L.hrs) + 'h'
       +         (L.type && L.type !== '固定' ? ' ｜ ' + esc(L.type) : '') + '</div>'
       +       (locked
            ? '<div class="applied">' + esc(T('applied').replace('{s}', L.applied)) + '</div>'
            : '')
       +       '<div class="lsub">'
       +         '<label>' + esc(T('subLabel')) + '</label>'
       +         '<select id="s' + i + '" data-i="' + i + '">' + opts + '</select>'
       +         '<input type="text" id="o' + i + '" class="hide" placeholder="'
       +            esc(T('otherPh')) + '" maxlength="20" style="margin-top:8px">'
       +       '</div>'
       +     '</div>'
       +   '</div>'
       + '</div>';
  });
  $('lessons').innerHTML = h;

  LESSONS.forEach(function(L, i){
    var cb = $('c' + i);
    if (cb) cb.addEventListener('change', function(){
      $('L' + i).classList.toggle('on', this.checked);
      refresh();
    });
    var sel = $('s' + i);
    if (sel) sel.addEventListener('change', function(){
      $('o' + i).classList.toggle('hide', this.value !== '__other__');
      refresh();
    });
    var oth = $('o' + i);
    if (oth) oth.addEventListener('input', refresh);
  });

  show($('reasonCard')); show($('sendCard'));
  if (PREFILL) { applyPrefill(); PREFILL = null; }
  refresh();
}

/* ---------- 字數 ---------- */
$('reason').addEventListener('input', function(){
  $('cnt').textContent = this.value.length + ' / 200';
  refresh();
});

/* ---------- 收集 + 驗證 ---------- */
function collect(){
  var picks = [], missing = false;
  LESSONS.forEach(function(L, i){
    var cb = $('c' + i);
    if (!cb || !cb.checked) return;
    var v = $('s' + i).value;
    var name = '';
    if (v === '__other__')      name = $('o' + i).value.trim();
    else if (v === '__none__')  name = '';                   // 待協尋
    else                        name = v;
    if (!v) { missing = true; return; }                      // 連選都沒選
    if (v === '__other__' && !name) { missing = true; return; }
    picks.push({ r: L.row, s: name });
  });
  return { picks: picks, missing: missing };
}

function refresh(){
  var c = collect();
  var ok = c.picks.length > 0 && !c.missing && $('reason').value.trim().length > 0;
  $('send').disabled = !ok;
}

/* ---------- 送出 ---------- */
$('send').addEventListener('click', function(){
  var c = collect();
  if (!c.picks.length) { say('err', esc(T('errNoPick'))); return; }
  if (c.missing)       { say('err', esc(T('errNoSub')));  return; }
  var reason = $('reason').value.trim();
  if (!reason)         { say('err', esc(T('errNoReason'))); return; }

  var btn = this;
  btn.disabled = true;
  btn.textContent = T('sending');
  clearSay();

  jsonp({
    action: 'submitLeave',
    token : TOKEN,
    date  : $('date').value,
    reason: reason,
    picks : JSON.stringify(c.picks)
  }, function(r){
    if (!r || !r.ok) {
      btn.disabled = false; btn.textContent = T('send');
      var e = r && r.error;
      if (e === 'busy') say('err', esc(T('errBusy')));
      else if (e === 'all_rejected')
        say('err', esc(T('skipped')) + '<br>' + esc((r.detail || []).join('、')));
      else say('err', esc(T('errNet')) + (e ? '（' + esc(e) + '）' : ''));
      return;
    }
    MINE = null;                                   // 快取作廢
    hide($('app'));
    $('tDone').textContent = T('doneTitle');
    $('doneMsg').textContent = T('doneMsg')
      .replace('{id}', r.applyId).replace('{n}', r.count);
    var extra = '';
    if (r.skipped && r.skipped.length)
      extra = '<p class="applied">' + esc(T('skipped')) + ' '
            + esc(r.skipped.join('、')) + '</p>';
    $('doneList').innerHTML = extra
      || '<p class="note">' + esc(T('sendNote')) + '</p>';
    show($('done'));
    btn.disabled = false; btn.textContent = T('send');
    window.scrollTo(0, 0);
  }, function(){
    btn.disabled = false; btn.textContent = T('send');
    say('err', esc(T('errNet')));
  });
});

/* ============================================================
 *  我的申請：查狀態、逐堂補交接事項、待核准自撤
 * ============================================================ */
function loadMine(force){
  if (MINE && !force) { renderMine(); return; }
  $('mineBody').innerHTML = '<div class="center"><div class="spin"></div><p>'
                          + esc(T('mineLoad')) + '</p></div>';
  jsonp({ action:'getMyLeaves', token:TOKEN }, function(r){
    if (!r || !r.ok) {
      $('mineBody').innerHTML = '<p class="applied">' + esc(T('errToken')) + '</p>';
      return;
    }
    MINE = r.items || [];
    if (r.max) HMAX = r.max;
    renderMine();
  }, function(){
    $('mineBody').innerHTML = '<p class="applied">' + esc(T('errNet')) + '</p>';
  });
}

function renderMine(){
  if (!MINE.length) {
    $('mineBody').innerHTML = '<div class="card"><p class="note">'
                            + esc(T('mineEmpty')) + '</p></div>';
    return;
  }

  // 依申請編號分組（後端已排好序）
  var groups = [], map = {};
  MINE.forEach(function(it){
    if (!map[it.apply]) { map[it.apply] = { apply: it.apply, items: [] }; groups.push(map[it.apply]); }
    map[it.apply].items.push(it);
  });

  var h = '';
  groups.forEach(function(g, gi){
    var first = g.items[0];
    h += '<div class="card">'
       +   '<div class="app-head">'
       +     '<div>'
       +       '<div class="app-date">' + esc(dateLabel(first.date)) + '</div>'
       +       '<div class="app-id">' + esc(g.apply) + '　'
       +         esc(T('reasonBy')) + '：' + esc(first.reason) + '</div>'
       +     '</div>'
       +     '<span class="st ' + stClass(first.status) + '">' + esc(first.status) + '</span>'
       +   '</div>';

    if (first.memo) {
      h += '<div class="note">' + esc(T('memoBy')) + '：' + esc(first.memo) + '</div>';
    }

    g.items.forEach(function(it){
      var tag = (String(it.role).indexOf('主') >= 0)
        ? '<span class="ltag lead">' + esc(T('lead')) + '</span>'
        : '<span class="ltag asst">' + esc(T('asst')) + '</span>';

      h += '<div class="item">'
         +   '<div><span class="lcls">' + esc(it.cls) + '</span>' + tag + '</div>'
         +   '<div class="note">' + esc(it.pc)
         +     '　｜　' + esc(T('subBy')) + '：' + esc(it.sub || T('noSub'))
         +     (it.subType ? '　｜　' + esc(T('typeBy')) + '：' + esc(it.subType) : '')
         +   '</div>'
         +   (it.progress
              ? '<div class="note">' + esc(T('progressBy')) + '：' + esc(it.progress) + '</div>'
              : '');

      if (it.canEdit) {
        h += '<div style="margin-top:9px">'
           +   '<label>' + esc(T('handoverLabel')) + '</label>'
           +   '<textarea id="h' + it.row + '" maxlength="' + HMAX + '" placeholder="'
           +      esc(T('handoverPh')) + '">' + esc(it.handover) + '</textarea>'
           +   '<div class="counter" id="hc' + it.row + '">'
           +      it.handover.length + ' / ' + HMAX + '</div>'
           +   '<div class="hbtns">'
           +     '<button class="btn-ghost" id="hs' + it.row + '">' + esc(T('hSave')) + '</button>'
           +     (it.status === '已核准' && it.sub
                ? '<button id="hn' + it.row + '">' + esc(T('hSaveNotify')) + '</button>' : '')
           +   '</div>'
           +   '<div class="saved" id="hm' + it.row + '"></div>'
           +   (it.hupd ? '<div class="note">' + esc(T('hSaved').replace('{t}', it.hupd)) + '</div>' : '')
           +   (it.status === '已核准'
                ? '<div class="note">' + esc(it.read
                    ? T('readAt').replace('{t}', it.read) : T('notRead')) + '</div>'
                : '')
           + '</div>';
      } else if (it.handover) {
        h += '<div style="margin-top:9px"><label>' + esc(T('handoverLabel')) + '</label>'
           +   '<div class="note">' + esc(it.handover) + '</div></div>';
      }

      h += '</div>';
    });

    if (first.status === '已駁回') {
      // 不修改歷史列，新開一列——駁回列凍結保留，稽核軌跡才完整
      h += '<button class="btn-ghost" id="rq' + gi + '" style="margin-top:12px">'
         +   esc(T('reapply')) + '</button>';
    } else if (first.canCancel) {
      h += '<button class="btn-danger" id="cx' + gi + '" style="margin-top:12px">'
         +   esc(T('cancel')) + '</button>';
    } else if (first.status !== '已核准' && first.status !== '已撤銷') {
      h += '<div class="note" style="margin-top:10px">'
         +   esc(T('hLockedNote').replace('{s}', first.status)) + '</div>';
    }

    h += '</div>';
  });

  $('mineBody').innerHTML = h;
  wireMine(groups);
}

function wireMine(groups){
  MINE.forEach(function(it){
    var ta = $('h' + it.row);
    if (ta) {
      ta.addEventListener('input', function(){
        $('hc' + it.row).textContent = this.value.length + ' / ' + HMAX;
      });
    }
    var bs = $('hs' + it.row);
    if (bs) bs.addEventListener('click', function(){ saveHandover(it, 0, this); });
    var bn = $('hn' + it.row);
    if (bn) bn.addEventListener('click', function(){ saveHandover(it, 1, this); });
  });

  groups.forEach(function(g, gi){
    var b = $('cx' + gi);
    if (b) b.addEventListener('click', function(){ cancelApply(g, this); });
    var r = $('rq' + gi);
    if (r) r.addEventListener('click', function(){ startReapply(g); });
  });
}

/* ---------- 以此重新申請 ---------- */
function startReapply(g){
  PREFILL = {
    date  : g.items[0].date,
    reason: g.items[0].reason,
    picks : g.items.map(function(it){
      return { cls: it.cls, pc: it.pc, role: it.role, sub: it.sub };
    })
  };
  switchTo('new');
  $('date').value = PREFILL.date;
  $('date').dispatchEvent(new Event('change'));   // 走一樣的查課流程，不另開路徑
}

/** renderLessons 之後才呼叫——要等課表畫出來才有東西可以勾 */
function applyPrefill(){
  var names = [];
  for (var n = 0; n < TEACHERS.length; n++) names.push(TEACHERS[n].name);

  var hit = 0, miss = [];

  LESSONS.forEach(function(L, i){
    var want = null;
    for (var k = 0; k < PREFILL.picks.length; k++) {
      var p = PREFILL.picks[k];
      if (p.cls === L.cls && p.pc === L.pc && p.role === L.role) { want = p; break; }
    }
    if (!want) return;

    var cb = $('c' + i);
    if (!cb || cb.disabled) { miss.push(L.cls); return; }   // 已經有別張申請中
    cb.checked = true;
    $('L' + i).classList.add('on');

    var sel = $('s' + i);
    if (want.sub && names.indexOf(want.sub) >= 0) {
      sel.value = want.sub;
    } else if (want.sub) {
      sel.value = '__other__';
      $('o' + i).classList.remove('hide');
      $('o' + i).value = want.sub;
    } else {
      sel.value = '__none__';
    }
    hit++;
  });

  $('reason').value = PREFILL.reason || '';
  $('cnt').textContent = $('reason').value.length + ' / 200';

  if (miss.length)   say('warn', esc(T('reapplyMiss').replace('{c}', miss.join('、'))));
  else if (hit)      say('warn', esc(T('reapplyNote')));
}

function saveHandover(it, notify, btn){
  var ta = $('h' + it.row);
  if (!ta) return;
  var text = ta.value.trim();
  var old = btn.textContent;
  btn.disabled = true;
  btn.textContent = T('hSaving');
  clearSay();

  jsonp({
    action: 'saveHandover',
    token : TOKEN,
    row   : it.row,
    text  : text,
    notify: notify ? 1 : 0
  }, function(r){
    btn.disabled = false; btn.textContent = old;
    if (!r || !r.ok) {
      var e = r && r.error;
      if (e === 'busy') say('err', esc(T('errBusy')));
      else if (e && e.indexOf('locked:') === 0)
        say('err', esc(T('hLockedNote').replace('{s}', e.split(':')[1])));
      else say('err', esc(T('errNet')) + (e ? '（' + esc(e) + '）' : ''));
      return;
    }
    it.handover = text;
    it.hupd = r.hupd;
    var m = $('hm' + it.row);
    m.className = 'saved show';
    m.textContent = r.mailed
      ? T('hSavedMailed').replace('{t}', r.hupd)
      : T('hSaved').replace('{t}', r.hupd);
  }, function(){
    btn.disabled = false; btn.textContent = old;
    say('err', esc(T('errNet')));
  });
}

function cancelApply(g, btn){
  var first = g.items[0];
  if (!window.confirm(T('cancelAsk').replace('{d}', dateLabel(first.date)))) return;

  var old = btn.textContent;
  btn.disabled = true;
  btn.textContent = T('cancelling');
  clearSay();

  jsonp({ action:'cancelLeave', token:TOKEN, apply:g.apply }, function(r){
    if (!r || !r.ok) {
      btn.disabled = false; btn.textContent = old;
      var e = r && r.error;
      if (e === 'busy') say('err', esc(T('errBusy')));
      else if (e && e.indexOf('already:') === 0)
        say('err', esc(T('errCancelled').replace('{s}', e.split(':')[1])));
      else say('err', esc(T('errNet')) + (e ? '（' + esc(e) + '）' : ''));
      return;
    }
    say('ok', esc(T('cancelled')));
    loadMine(true);
  }, function(){
    btn.disabled = false; btn.textContent = old;
    say('err', esc(T('errNet')));
  });
}
</script>
